<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metrika Home [0.5] — demo</title>
  <meta name="description" content="Браузерное превью Metrika Home: лаунчер, роли Администратор / Пользователь / Оператор, полный складской контур на демо-данных." />
  <link rel="icon" href="../assets/readme/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="metrika-app.css?v=8" />
  <link rel="stylesheet" href="metrika-ui.css?v=8" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('metrika-lang');
        var lang = saved === 'en' || saved === 'ru'
          ? saved
          : ((navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'ru');
        document.documentElement.lang = lang;
        var theme = localStorage.getItem('metrika-site-theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root">
    <section id="welcome" class="welcome"></section>
    <div id="launcherRoot" class="launcher-root hidden"></div>
    <div id="appRoot" class="app-root hidden"></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <script src="demo-data.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
